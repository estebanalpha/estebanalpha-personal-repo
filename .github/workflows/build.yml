name: build-repo

on:
  push:
    branches: [main]
    paths:
      - 'packages/**'
      - 'build.sh'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # build.sh usa git log para SOURCE_DATE_EPOCH por paquete

      - name: Build packages and refresh apt index
        run: ./build.sh

      - name: Commit updated repo index
        run: |
          if ! git diff --quiet docs/; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/
            git commit -m "ci: rebuild packages and refresh apt index [skip ci]"
            git push
          else
            echo "docs/ sin cambios, nada que commitear"
          fi
